apiVersion: v1alpha1
kind: Setting
metadata:
  name: z-blog-sg-setting
spec:
  forms:
    - group: basic
      label: 基础设置
      formSchema:
        - $formkit: text
          name: custom_footer
          label: 页脚附加文本
          value: ""
          placeholder: "留空则不显示"
          help: "显示在版权声明下方的自定义一行，例如建站时间或联系方式。"
        - $formkit: text
          name: master_name
          label: 站长称呼
          value: "站长"
          placeholder: "站长"
          help: "显示在文章详情的「D-Mail 发送记录 · 发信人」与关于页的成员卡上。"
        - $formkit: text
          name: member_page_slug
          label: 关于页 slug
          value: "about"
          help: "该 slug 的独立页面会在正文上方渲染研究所成员卡；留空按 about 处理。"
        - $formkit: text
          name: friends_page_slug
          label: 友链页 slug
          value: "friends"
          help: "该 slug 的独立页面会把正文渲染成友链卡片网格；留空按 friends 处理。"
    - group: interaction
      label: 交互与动效
      formSchema:
        - $formkit: select
          name: worldline_default
          label: 默认世界线
          value: beta
          options:
            - label: β 世界线（暖色，默认）
              value: beta
            - label: α 世界线（冰蓝）
              value: alpha
          help: "访客没有保存过选择时使用；访客手动切换后以访客的选择为准。"
        - $formkit: checkbox
          name: plain_mode_default
          label: 默认开启简洁模式
          value: false
          help: "开启后扫描线、粒子、打字机与滚动数字等动效默认全部关闭，访客仍可在导航栏自行打开。"
        - $formkit: select
          name: divergence_source
          label: Divergence Meter 数据源
          value: attractor
          options:
            - label: 世界线变动率 1.048596%
              value: attractor
            - label: 站点真实文章数
              value: live
          help: "访客数、评论数等真实统计要等接入 umami 之后才会提供。"
        - $formkit: checkbox
          name: effects_particles
          label: 背景粒子
          value: true
          help: "关闭后不再创建 Canvas 星空层，可省电。"
        - $formkit: checkbox
          name: effects_pointer_glow
          label: 鼠标跟随辉光
          value: true
          help: "触屏设备与窄屏自动禁用，无需手动关闭。"
    - group: integration
      label: 集成
      formSchema:
        - $formkit: checkbox
          name: comments_enabled
          label: 启用评论
          value: true
          help: "关闭后文章与页面都不再渲染评论区，访客看不到也发不了评论。"
        - $formkit: text
          name: comments_server
          label: 评论服务地址
          value: ""
          placeholder: "留空表示 /artalk"
          help: "线上留空即可（同域名由 Caddy 把 /artalk 转发给评论后端）；本地没有 Caddy，填 http://localhost:23366。"
        - $formkit: text
          name: comments_site_name
          label: 评论站点名
          value: ""
          placeholder: "留空用站点标题"
          help: "必须与 Artalk 后台里站点的名称一致，否则评论会落到「默认站点」。创建站点的方法见 deploy/README.md 的「评论（Artalk）」一节。"
