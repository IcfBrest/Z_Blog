<include src="layout.html">
  <template name="head">
    <title th:text="|标签 - ${site.title}|">标签</title>
  </template>

  <h1 class="sg-hero__title">标签</h1>
  <p class="sg-hero__desc">散落在各条世界线上的关键词。</p>

  <!-- 与 /categories 同理：Halo 2.27 给的 tags 是 ArrayList，不是分页对象。 -->
  <p class="sg-hero__desc" th:if="${#lists.isEmpty(tags)}">还没有打标签。</p>

  <!-- 标签集合放进终端面板，与其它页面的终端形态保持一致 -->
  <section class="sg-terminal" th:unless="${#lists.isEmpty(tags)}">
    <div class="sg-terminal__bar" aria-hidden="true">
      <span class="sg-terminal__led"></span>
      <span class="sg-terminal__name">TAGS</span>
    </div>
    <div class="sg-terminal__body">
      <ul class="sg-chip-list">
        <li th:each="tag : ${tags}">
          <a class="sg-chip" th:href="@{${tag.status.permalink}}" th:text="${tag.spec.displayName}"></a>
        </li>
      </ul>
    </div>
  </section>
</include>
