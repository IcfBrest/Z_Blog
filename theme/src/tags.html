<include src="layout.html">
  <template name="head">
    <title th:text="|标签 - ${site.title}|">标签</title>
  </template>

  <h1 class="sg-hero__title">标签</h1>
  <p class="sg-hero__desc">散落在各条世界线上的关键词。</p>

  <ul class="sg-chip-list">
    <li th:each="tag : ${tags.items}">
      <a th:href="@{${tag.status.permalink}}" th:text="${tag.spec.displayName}" class="sg-chip"></a>
    </li>
  </ul>

  <nav class="sg-pagination" th:if="${tags.hasPrevious() || tags.hasNext()}">
    <a th:if="${tags.hasPrevious()}" th:href="@{${tags.prevUrl}}">上一页</a>
    <span th:text="|${tags.page} / ${tags.totalPages}|"></span>
    <a th:if="${tags.hasNext()}" th:href="@{${tags.nextUrl}}">下一页</a>
  </nav>
</include>
