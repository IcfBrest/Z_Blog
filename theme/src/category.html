<include src="layout.html">
  <template name="head">
    <title th:text="|${category.spec.displayName} - ${site.title}|">分类</title>
    <include src="meta.html" />
  </template>

  <header class="sg-hero">
    <p class="sg-hero__kicker">Worldline Branch</p>
    <h1 class="sg-hero__title" th:text="${category.spec.displayName}"></h1>
    <!-- DR-2：分类 → 世界线分支标识 -->
    <p class="sg-branch sg-branch--inline">
      <span class="sg-branch__label">世界线分支</span>
      <span class="sg-branch__name" th:text="${category.spec.displayName}"></span>
    </p>
    <p
      class="sg-hero__desc"
      th:if="${category.spec.description}"
      th:text="${category.spec.description}"
    ></p>
  </header>

  <ul class="sg-post-list">
    <include src="post-card.html"></include>
  </ul>

  <include src="pagination.html"></include>
</include>
