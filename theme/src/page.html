<include src="layout.html">
  <template name="head">
    <title th:text="|${singlePage.spec.title} - ${site.title}|">独立页面</title>
  </template>

  <article class="sg-article">
    <header class="sg-article-header">
      <h1 class="sg-article-title" th:text="${singlePage.spec.title}"></h1>
    </header>
    <div class="sg-article-content" th:utext="${singlePage.content.content}"></div>
  </article>

  <div th:if="${haloCommentEnabled}">
    <halo:comment
      group="content.halo.run"
      kind="SinglePage"
      th:attr="name=${singlePage.metadata.name}"
    />
  </div>
</include>
