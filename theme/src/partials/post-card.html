<li class="sg-post-item sg-card" th:each="post : ${posts.items}">
  <p class="sg-card__marker" aria-hidden="true">D-Mail</p>
  <h2 class="sg-post-title">
    <a th:href="@{${post.status.permalink}}" th:text="${post.spec.title}"></a>
  </h2>
  <p class="sg-post-meta">
    <time th:text="${#temporals.format(post.spec.publishTime, 'yyyy-MM-dd')}"></time>
    <!-- DR-2：列表项也要能看出属于哪条世界线（分类 → 分支） -->
    <span class="sg-card__branch" th:if="${not #lists.isEmpty(post.categories)}">
      <span class="sg-branch__label">世界线</span>
      <a
        th:each="cat : ${post.categories}"
        class="sg-chip sg-chip--branch"
        th:href="@{${cat.status.permalink}}"
        th:text="${cat.spec.displayName}"
      ></a>
    </span>
  </p>
  <p class="sg-post-excerpt" th:text="${post.status.excerpt}"></p>
</li>
