<include src="layout.html">
  <template name="head">
    <title th:text="|未找到该世界线 - ${site.title}|">404</title>
  </template>

  <section class="sg-error">
    <p class="sg-error__code" th:text="${statusCode} ?: '404'">404</p>
    <h1 class="sg-error__title">未找到该世界线</h1>
    <p
      class="sg-error__desc"
      th:if="${not #strings.isEmpty(message)}"
      th:text="${message}"
    >这条世界线上没有你要找的页面。</p>
    <p><a th:href="@{/}" href="/">返回主世界线</a></p>
  </section>
</include>
