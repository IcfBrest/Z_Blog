<include src="layout.html">
  <template name="head">
    <title th:text="|${author.spec.displayName} - ${site.title}|">作者</title>
    <include src="meta.html" />
  </template>

  <header class="sg-hero">
    <p class="sg-hero__kicker">Observer</p>
    <h1 class="sg-hero__title" th:text="${author.spec.displayName}"></h1>
    <p
      class="sg-hero__desc"
      th:if="${not #strings.isEmpty(author.spec.bio)}"
      th:text="${author.spec.bio}"
    ></p>
  </header>

  <ul class="sg-post-list">
    <include src="post-card.html"></include>
  </ul>

  <include src="pagination.html"></include>
</include>
